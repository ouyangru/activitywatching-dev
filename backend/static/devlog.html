<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#131a22">
<title>行迹 · 开发者视图</title>
<link rel="stylesheet" href="/static/styles.css?v=20260909-2">
<link rel="stylesheet" href="/static/design.css?v=20260909-4">
<style>
  .devlog-toolbar { display:flex; flex-direction:column; gap:9px; margin:14px 0; }
  .devlog-filter-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .devlog-filter-label { min-width:54px; font-size:12px; color:var(--muted); }
  .devlog-kinds { display:flex; flex-wrap:wrap; gap:4px; padding:3px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.025); }
  .devlog-kinds button { border:0; background:transparent; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:6px; cursor:pointer; transition:.15s ease; }
  .devlog-kinds button:hover { color:var(--text); background:rgba(130,206,221,.08); }
  .devlog-kinds button.is-active { color:var(--text); background:rgba(130,206,221,.14); }
  .devlog-search { background:transparent; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:7px 10px; font-size:13px; min-width:200px; }
  .devlog-meta { font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; gap:14px; margin:0 0 10px; }
  .devlog-meta b { color:var(--text); font-weight:600; }
  .devlog-count-error { color:#f2a4a4; }
  .devlog-count-warn { color:#e5c38f; }
  .devlog-stream { display:flex; flex-direction:column; gap:7px; }
  .devlog-entry { border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.02); overflow:hidden; position:relative; }
  .devlog-entry.is-error { border-color:rgba(232,110,110,.72); background:rgba(232,110,110,.075); box-shadow:inset 3px 0 0 rgba(232,110,110,.82); }
  .devlog-entry.is-warn:not(.is-error) { border-color:rgba(214,173,121,.58); background:rgba(214,173,121,.05); box-shadow:inset 3px 0 0 rgba(214,173,121,.72); }
  .devlog-entry.is-slow:not(.is-error):not(.is-warn) { border-color:rgba(130,206,221,.45); box-shadow:inset 3px 0 0 rgba(130,206,221,.55); }
  .devlog-entry-head { display:flex; align-items:center; gap:8px; padding:8px 11px; cursor:pointer; user-select:none; min-width:0; }
  .devlog-entry-head:hover { background:rgba(130,206,221,.04); }
  .devlog-entry-id { font-size:11px; color:var(--muted); min-width:46px; }
  .devlog-time { font-size:12px; color:var(--muted); min-width:48px; font-variant-numeric:tabular-nums; }
  .devlog-module { font-size:11px; padding:4px 7px; border:1px solid var(--line); border-radius:5px; color:#b8cad8; background:#17212b; white-space:nowrap; }
  .devlog-badge { font-size:11px; line-height:1; padding:4px 7px; border-radius:5px; white-space:nowrap; }
  .devlog-badge.http { background:rgba(130,206,221,.16); color:#9fd4e0; }
  .devlog-badge.ingest { background:rgba(146,163,217,.16); color:#aab8e8; }
  .devlog-badge.agent_inject { background:rgba(214,173,121,.16); color:#e2c49a; }
  .devlog-badge.agent_input { background:rgba(145,229,182,.14); color:#a5e8c6; }
  .devlog-badge.agent_output { background:rgba(179,160,206,.18); color:#c9bce4; }
  .devlog-badge.event { background:rgba(188,196,207,.12); color:#c6d1dc; }
  .devlog-alert { font-size:10px; font-weight:700; padding:3px 6px; border-radius:4px; white-space:nowrap; }
  .devlog-alert.is-error { color:#ffd0d0; background:rgba(232,110,110,.22); }
  .devlog-alert.is-warn { color:#f0d2a5; background:rgba(214,173,121,.2); }
  .devlog-alert.is-slow { color:#b6e6ef; background:rgba(130,206,221,.18); }
  .devlog-summary { font-size:12.5px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:120px; }
  .devlog-body { display:none; border-top:1px solid var(--line); padding:10px 12px; }
  .devlog-entry.is-open .devlog-body { display:block; }
  .devlog-body h4 { margin:2px 0 6px; font-size:11px; letter-spacing:.08em; color:var(--muted); font-weight:600; }
  .devlog-body pre { margin:0 0 10px; padding:10px; background:rgba(0,0,0,.25); border-radius:7px; font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-all; color:#d2e1e8; max-height:420px; overflow:auto; }
  .devlog-body pre:last-child { margin-bottom:0; }
  .devlog-note { font-size:12px; color:var(--muted); line-height:1.6; }
  .devlog-empty { padding:30px 10px; text-align:center; color:var(--muted); font-size:13px; }
  .devlog-toggle { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); cursor:pointer; }
  .devlog-toggle.is-important { color:#d7e2e9; }
  @media (max-width: 760px) {
    .devlog-filter-label { width:100%; }
    .devlog-entry-head { flex-wrap:wrap; }
    .devlog-summary { width:100%; flex-basis:100%; padding-left:54px; }
  }
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<a class="brand" href="/" aria-label="行迹首页">
<span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>行迹</a>
<nav class="topbar-nav">
<a class="nav-link" href="/" data-day-link>总览</a>
<a class="nav-link" href="/daily" data-day-link>日报</a>
<a class="nav-link" href="/compare" data-day-link>多日对比</a>
<a class="nav-link is-active" href="/devlog">开发</a>
</nav>
<span class="timezone-note" id="timezoneNote"></span>
</header>
<section class="hero">
<div>
<p class="eyebrow">DEV VIEW</p>
<h1>开发者视图 · 调试日志流</h1>
<p class="hero-meta">按业务模块和日志类型筛选；后端 4xx/5xx、浏览器异常和慢请求都会直接高亮。日志仅保存在内存中，重启清空。</p>
</div>
</section>

<p class="devlog-meta" id="devStatus" aria-live="polite"></p>

<div class="devlog-toolbar">
  <div class="devlog-filter-row">
    <span class="devlog-filter-label">模块</span>
    <div class="devlog-kinds" id="devModuleBar" aria-label="业务模块">
      <button type="button" class="is-active" data-module="">全部</button>
      <button type="button" data-module="activity">活动分析</button>
      <button type="button" data-module="frontend">前端</button>
      <button type="button" data-module="recruitment">秋招事项</button>
      <button type="button" data-module="feishu">招聘进度</button>
      <button type="button" data-module="calendar">日历</button>
      <button type="button" data-module="mail">邮件扫描</button>
      <button type="button" data-module="bridge">招聘↔日历</button>
      <button type="button" data-module="agent">Agent</button>
      <button type="button" data-module="ingest">采集</button>
      <button type="button" data-module="system">系统</button>
    </div>
  </div>
  <div class="devlog-filter-row">
    <span class="devlog-filter-label">类型</span>
    <div class="devlog-kinds" id="devKindBar" role="tablist" aria-label="日志类别">
      <button type="button" class="is-active" data-kind="">全部</button>
      <button type="button" data-kind="http">API 请求</button>
      <button type="button" data-kind="ingest">采集上传</button>
      <button type="button" data-kind="agent_inject">记忆注入</button>
      <button type="button" data-kind="agent_input">Agent 输入</button>
      <button type="button" data-kind="agent_output">Agent 输出</button>
      <button type="button" data-kind="event">模块事件</button>
    </div>
  </div>
  <div class="devlog-filter-row">
    <span class="devlog-filter-label">视图</span>
    <input class="devlog-search" id="devSearch" type="search" placeholder="搜索路径、错误、模块内容…" aria-label="搜索日志">
    <label class="devlog-toggle is-important"><input type="checkbox" id="devOnlyAbnormal">仅异常 / 警告</label>
    <label class="devlog-toggle"><input type="checkbox" id="devOnlySlow">仅慢请求</label>
    <label class="devlog-toggle"><input type="checkbox" id="devAuto" checked>自动刷新（3 秒）</label>
    <button class="ghost-button" type="button" id="devRefresh">立即刷新</button>
    <button class="ghost-button" type="button" id="devClear">清空</button>
  </div>
</div>

<p class="page-state" id="devState" role="status" aria-live="polite"></p>
<section class="panel">
<div class="panel-heading"><h2>日志流</h2><span class="timezone-note">新在前 · 点击条目展开结构化详情</span></div>
<div id="devStream" class="devlog-stream"><p class="devlog-empty">加载中…</p></div>
</section>
<p class="devlog-note" id="devNotice">HTTP 日志不记录 query string；浏览器异常只记录错误、脚本路径和栈；飞书 token、App Secret、邮箱正文等敏感内容不会进入该日志流。</p>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/ui.js?v=20260912-3" defer></script>
<script src="/static/devlog.js?v=20260912-3" defer></script>
</body>
</html>
