<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1b1a">
  <title>行迹 · 今日行为时间线</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2310201e'/%3E%3Cpath d='M18 40V29M32 40V17M46 40V24' stroke='%2391e5b6' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css?v=20260906-5">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="行迹首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>行迹</span>
      </a>
      <nav class="topbar-nav">
        <a class="nav-link is-active" href="/">今日</a>
        <a class="nav-link" href="/daily">日报</a>
      </nav>
      <div class="live-pill"><span></span> <b id="connectionLabel">正在连接</b></div>
      <time id="todayLabel"></time>
    </header>

    <section class="hero" aria-labelledby="currentTitle">
      <div>
        <p class="eyebrow">CURRENT FOCUS · 当前状态</p>
        <h1 id="currentTitle">等待第一段行为数据</h1>
        <p id="currentMeta" class="hero-meta">启动采集器后，新的特征窗口会自动出现在这里。</p>
        <div id="deviceStatusRow" class="device-status-row" aria-label="设备在线状态"></div>
      </div>
      <div class="focus-orbit" aria-hidden="true"><span></span></div>
    </section>

    <section class="stats" aria-label="今日概览">
      <article><span id="trackedLabel">已记录设备时长</span><strong id="trackedTime">0min</strong></article>
      <article><span>行为片段</span><strong id="segmentCount">0</strong></article>
      <article><span>专注占比</span><strong id="focusRate">0%</strong></article>
      <article><span>数据策略</span><strong class="privacy-value">仅汇总</strong></article>
    </section>

    <div class="content-grid trio">
      <section class="panel timeline-panel" aria-labelledby="timelineTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">ACTIVITY STREAM</p>
            <h2 id="timelineTitle">今日时间线</h2>
          </div>
          <div class="timeline-actions">
            <div class="view-switch" role="tablist" aria-label="时间线视图">
              <button class="view-switch-button is-active" type="button" role="tab" aria-selected="true" data-timeline-view="detail">设备明细</button>
              <button class="view-switch-button" type="button" role="tab" aria-selected="false" data-timeline-view="combined">主活动</button>
            </div>
            <label class="device-filter-label" for="deviceFilter">设备</label>
            <select id="deviceFilter" class="device-filter">
              <option value="">全部设备</option>
            </select>
            <label class="device-filter-label" for="timelineOrder">顺序</label>
            <select id="timelineOrder" class="device-filter timeline-order">
              <option value="desc" selected>最新在前</option>
              <option value="asc">最早在前</option>
            </select>
            <button id="refreshButton" class="ghost-button" type="button">刷新数据</button>
          </div>
        </div>
        <div id="timeline" class="timeline" aria-live="polite"></div>
      </section>

      <section class="panel insights-panel" aria-labelledby="insightsTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">INSIGHTS</p>
            <h2 id="insightsTitle">专注洞察</h2>
          </div>
        </div>
        <div class="focus-grid" id="focusGrid"></div>
        <h3 class="ranking-title">应用排行</h3>
        <ol id="appRanking" class="ranking-list"></ol>
      </section>

      <section class="panel distribution-panel" aria-labelledby="distributionTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">DISTRIBUTION</p>
            <h2 id="distributionTitle">时间分布</h2>
          </div>
        </div>
        <p class="distribution-note">综合视图将同时使用多个设备的时间合并为主活动；下方分别展示每台设备。分类显示时长，目的显示时长与占比。</p>
        <div id="distributionScopes"></div>
      </section>
    </div>

    <section class="privacy-card bottom-privacy">
      <div class="shield" aria-hidden="true">✓</div>
      <div>
        <strong>隐私保护已启用</strong>
        <p>电脑只保存交互次数；手机只保存应用使用时段和锁屏状态，不保存输入内容。</p>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <script src="/static/app.js?v=20260906-5" defer></script>
</body>
</html>
